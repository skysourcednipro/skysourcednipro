            <button id="btn-login" class="flex items-center gap-2.5 active:scale-95 transition-transform group bg-transparent border-none text-left">
                <div class="w-8 h-8 md:w-9 md:h-9 bg-gray-50 rounded-full flex items-center justify-center border border-gray-200 group-hover:bg-white transition-all shrink-0">
                    <svg class="w-3.5 h-3.5 md:w-4 md:h-4" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>

            <div class="flex flex-col items-end gap-1">
                <a href="tel:+380966974664" class="flex items-center gap-1.5 text-gray-900 hover:text-blue-600 transition-colors">
                    <svg class="w-3 h-3 text-green-500" fill="currentColor" viewBox="0 0 24 24"><path d="M6.62 10.79c1.44 2.83 3.76 5.14 6.59 6.59l2.2-2.2c.27-.27.67-.36 1.02-.24 1.12.37 2.33.57 3.57.57.55 0 1 .45 1 1V20c0 .55-.45 1-1 1-9.39 0-17-7.61-17-17 0-.55.45-1 1-1h3.5c.55 0 1 .45 1 1 0 1.25.2 2.45.57 3.57.11.35.03.74-.25 1.02l-2.2 2.2z"/></svg>

                </a>

    <script>
        // Маска телефона
        const phoneInput = document.getElementById('lead-phone');
        phoneInput.addEventListener('input', function (e) {
            let val = e.target.value.replace(/\D/g, ''); 
            if (val.startsWith('38')) val = val.slice(2);
            let formatted = '+38 ';
            if (val.length > 0) formatted += '(' + val.substring(0, 3);
            if (val.length >= 4) formatted += ') ' + val.substring(3, 6);
            if (val.length >= 7) formatted += '-' + val.substring(6, 8);
            if (val.length >= 9) formatted += '-' + val.substring(8, 10);
            e.target.value = formatted;
        });

        // Умный ввод адреса
        const streetInput = document.getElementById('lead-street');
        const houseInput = document.getElementById('lead-house');

        streetInput.addEventListener('input', (e) => {
            if (e.target.value.includes(',')) {
                e.target.value = e.target.value.replace(',', ''); 
                houseInput.focus();
            }
        });

        houseInput.addEventListener('keydown', (e) => {
            if (e.key === 'Backspace' && houseInput.value === '') {
                streetInput.focus();
                setTimeout(() => {
                    const len = streetInput.value.length;
                    streetInput.setSelectionRange(len, len);
                }, 10);
            }
        });

        // ОБРАБОТКА И ОТПРАВКА ЛИДА (PIXEL + CAPI)
        document.getElementById('btn-submit-lead').addEventListener('click', () => {
            const name = document.getElementById('lead-name').value.trim();
            const phone = document.getElementById('lead-phone').value.trim();
            const street = document.getElementById('lead-street').value.trim();
            const house = document.getElementById('lead-house').value.trim();

            if(!name || phone.length < 17 || !street || !house) {
                alert('Пожалуйста, заполните все поля.');
                return;
            }

            // Генерируем уникальный Event ID для дедупликации между Pixel и CAPI
            const eventId = 'lead_' + Date.now() + '_' + Math.random().toString(36).substr(2, 6);

            // 1. Отправка через Meta Pixel (клиент)
            if (typeof fbq === 'function') {
                fbq('track', 'Lead', {}, { eventID: eventId });
                fbq('track', 'SubmitApplication', {}, { eventID: 'app_' + eventId });
            }

            // 2. Отправка через Conversions API (сервер)
            fetch('lead.php', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({
                    name: name,
                    phone: phone,
                    street: street,
                    house: house,
                    eventId: eventId
                })
            }).catch(err => console.error('Ошибка отправки CAPI:', err));

            // Анимация успешной отправки
            const btn = document.getElementById('btn-submit-lead');
            btn.innerHTML = 'Принято! Скоро позвоним ✅';
            btn.classList.replace('from-blue-600', 'from-green-500');
            btn.classList.replace('to-blue-500', 'to-green-400');
            btn.classList.replace('hover:from-blue-700', 'hover:from-green-600');
            btn.classList.replace('hover:to-blue-600', 'hover:to-green-500');
            
            setTimeout(() => {
                document.getElementById('lead-name').value = '';
                document.getElementById('lead-phone').value = '';
                document.getElementById('lead-street').value = '';
                document.getElementById('lead-house').value = '';
                
                btn.innerHTML = 'Заказать воду <svg class="w-4 h-4 md:w-5 md:h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M14 5l7 7m0 0l-7 7m7-7H3"></path></svg>';
                btn.classList.replace('from-green-500', 'from-blue-600');
                btn.classList.replace('to-green-400', 'to-blue-500');
                btn.classList.replace('hover:from-green-600', 'hover:from-blue-700');
                btn.classList.replace('hover:to-green-500', 'hover:to-blue-600');
            }, 3500);
        });

        // Клик по ЛК
        document.getElementById('btn-login').addEventListener('click', () => {
            if (typeof fbq === 'function') {
                fbq('track', 'CompleteRegistration');
            }
            window.location.href = 'index.html'; 
        });

        // Клик по телефонам
        document.querySelectorAll('a[href^="tel:"]').forEach(link => {
            link.addEventListener('click', () => {
                if (typeof fbq === 'function') {
                    fbq('track', 'Contact');
                }
            });
        });
    </script>
