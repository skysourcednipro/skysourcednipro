<!DOCTYPE html>
<html lang="uk" class="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <meta name="theme-color" content="#1e3a8a">
    <title>404 - Сторінка не знайдена | Sky Source</title>
    
    <!-- Підключення Tailwind та налаштування -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: { extend: {} }
        }
    </script>
</head>
<body class="bg-gray-50 dark:bg-slate-900 text-gray-900 dark:text-gray-100 transition-colors duration-300 font-sans antialiased min-h-screen flex flex-col justify-center items-center p-6">

    <div class="max-w-md w-full text-center flex flex-col items-center">
        
        <!-- Логотип -->
        <a href="/" class="mb-10 hover:scale-105 transition-transform active:scale-95">
            <img src="https://i.ibb.co/Y7jCqPDF/c660937a-9272-4146-82e4-074b94f35d73.png" alt="Sky Source" class="h-16 object-contain rounded-md drop-shadow-sm">
        </a>

        <!-- Величезна цифра 404 -->
        <h1 class="text-8xl md:text-9xl font-black text-transparent bg-clip-text bg-gradient-to-b from-blue-500 to-blue-800 dark:from-blue-400 dark:to-blue-700 mb-4 drop-shadow-lg">
            404
        </h1>
        
        <!-- Заголовок та текст -->
        <h2 class="text-3xl font-black text-blue-950 dark:text-white mb-4 tracking-tight">
            Ой, ця сторінка випарувалась...
        </h2>
        <p class="text-gray-500 dark:text-gray-400 text-lg mb-10 font-medium">
            Схоже, ви перейшли за невірним посиланням, або сторінка була видалена. Але не хвилюйтеся, вода в нас ще є!
        </p>

        <!-- Кнопка повернення -->
        <a href="/" class="w-full sm:w-auto px-10 py-4 bg-blue-600 hover:bg-blue-700 text-white rounded-2xl font-bold shadow-lg shadow-blue-600/30 transition-all active:scale-95 text-lg inline-flex justify-center items-center gap-3">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 19l-7-7m0 0l7-7m-7 7h18"></path></svg>
            На головну
        </a>
        
    </div>

    <script>
        // Перевірка локального сховища для застосування темної теми з основного додатку
        if(localStorage.getItem('theme') === 'dark') {
            document.documentElement.classList.add('dark');
        }
    </script>
</body>
</html>
